// ═══════════════════════════════════════════════════════════════
// ML TRAINING ENGINE — Neural Network Crab Brain
// ═══════════════════════════════════════════════════════════════

class Chitin611 {
    constructor(inputSize, hiddenSize, outputSize) {
        this.inputSize = inputSize;
        this.hiddenSize = hiddenSize;
        this.outputSize = outputSize;
        // Xavier init
        this.W1 = this.randMatrix(hiddenSize, inputSize, Math.sqrt(2 / inputSize));
        this.b1 = new Array(hiddenSize).fill(0);
        this.W2 = this.randMatrix(outputSize, hiddenSize, Math.sqrt(2 / hiddenSize));
        this.b2 = new Array(outputSize).fill(0);
        // Adam optimizer state
        this.mW1 = this.zeros(hiddenSize, inputSize);
        this.vW1 = this.zeros(hiddenSize, inputSize);
        this.mW2 = this.zeros(outputSize, hiddenSize);
        this.vW2 = this.zeros(outputSize, hiddenSize);
        this.mb1 = new Array(hiddenSize).fill(0);
        this.vb1 = new Array(hiddenSize).fill(0);
        this.mb2 = new Array(outputSize).fill(0);
        this.vb2 = new Array(outputSize).fill(0);
        this.t = 0;
    }

    zeros(r, c) { return Array.from({length: r}, () => new Array(c).fill(0)); }
    randMatrix(r, c, scale) {
        return Array.from({length: r}, () =>
            Array.from({length: c}, () => (Math.random() * 2 - 1) * scale)
        );
    }

    tanh(x) { return Math.tanh(x); }
    dtanh(y) { return 1 - y * y; }

    forward(input) {
        // Hidden layer
        this.z1 = [];
        this.a1 = [];
        for (let i = 0; i < this.hiddenSize; i++) {
            let sum = this.b1[i];
            for (let j = 0; j < this.inputSize; j++) sum += this.W1[i][j] * input[j];
            this.z1.push(sum);
            this.a1.push(this.tanh(sum));
        }
        // Output layer
        this.z2 = [];
        this.a2 = [];
        for (let i = 0; i < this.outputSize; i++) {
            let sum = this.b2[i];
            for (let j = 0; j < this.hiddenSize; j++) sum += this.W2[i][j] * this.a1[j];
            this.z2.push(sum);
            this.a2.push(Math.tanh(sum)); // output in [-1, 1]
        }
        return this.a2;
    }

    backward(input, targets, lr = 0.001) {
        this.t++;
        const beta1 = 0.9, beta2 = 0.999, eps = 1e-8;

        // Output error
        const dO = [];
        for (let i = 0; i < this.outputSize; i++) {
            dO.push((this.a2[i] - targets[i]) * this.dtanh(this.a2[i]));
        }

        // Hidden error
        const dH = [];
        for (let j = 0; j < this.hiddenSize; j++) {
            let sum = 0;
            for (let i = 0; i < this.outputSize; i++) sum += this.W2[i][j] * dO[i];
            dH.push(sum * this.dtanh(this.a1[j]));
        }

        // Update W2, b2
        for (let i = 0; i < this.outputSize; i++) {
            for (let j = 0; j < this.hiddenSize; j++) {
                const g = dO[i] * this.a1[j];
                this.mW2[i][j] = beta1 * this.mW2[i][j] + (1 - beta1) * g;
                this.vW2[i][j] = beta2 * this.vW2[i][j] + (1 - beta2) * g * g;
                const mHat = this.mW2[i][j] / (1 - Math.pow(beta1, this.t));
                const vHat = this.vW2[i][j] / (1 - Math.pow(beta2, this.t));
                this.W2[i][j] -= lr * mHat / (Math.sqrt(vHat) + eps);
            }
            const g = dO[i];
            this.mb2[i] = beta1 * this.mb2[i] + (1 - beta1) * g;
            this.vb2[i] = beta2 * this.vb2[i] + (1 - beta2) * g * g;
            const mHat = this.mb2[i] / (1 - Math.pow(beta1, this.t));
            const vHat = this.vb2[i] / (1 - Math.pow(beta2, this.t));
            this.b2[i] -= lr * mHat / (Math.sqrt(vHat) + eps);
        }

        // Update W1, b1
        for (let j = 0; j < this.hiddenSize; j++) {
            for (let k = 0; k < this.inputSize; k++) {
                const g = dH[j] * input[k];
                this.mW1[j][k] = beta1 * this.mW1[j][k] + (1 - beta1) * g;
                this.vW1[j][k] = beta2 * this.vW1[j][k] + (1 - beta2) * g * g;
                const mHat = this.mW1[j][k] / (1 - Math.pow(beta1, this.t));
                const vHat = this.vW1[j][k] / (1 - Math.pow(beta2, this.t));
                this.W1[j][k] -= lr * mHat / (Math.sqrt(vHat) + eps);
            }
            const g = dH[j];
            this.mb1[j] = beta1 * this.mb1[j] + (1 - beta1) * g;
            this.vb1[j] = beta2 * this.vb1[j] + (1 - beta2) * g * g;
            const mHat = this.mb1[j] / (1 - Math.pow(beta1, this.t));
            const vHat = this.vb1[j] / (1 - Math.pow(beta2, this.t));
            this.b1[j] -= lr * mHat / (Math.sqrt(vHat) + eps);
        }
    }

    serialize() {
        return JSON.stringify({W1: this.W1, b1: this.b1, W2: this.W2, b2: this.b2});
    }
    deserialize(data) {
        const d = JSON.parse(data);
        this.W1 = d.W1; this.b1 = d.b1; this.W2 = d.W2; this.b2 = d.b2;
    }
}

// ── Training Controller ──

    episodeRewards: [],
    episodeSurvival: [],
    survivalTime: 0,
    epsilon: 1.0,      // exploration rate
    epsilonDecay: 0.995,
    epsilonMin: 0.05,
    gamma: 0.95,        // discount factor (lower = more myopic)
    lr: 0.003,
    // Reward shaping
    penaltyDied: -50,
    // Graph

    graphData: [],
    maxGraphPoints: 100,
    // Episode timing
    episodeStartTime: 0,
    maxEpisodeFrames: 1800, // 30 seconds at 60fps
    frameCount: 0,
    // Auto-click simulation

    autoClickInterval: 2.0, // seconds between simulated clicks
    lastClickTime: 0,
};

function extractState() {
    const w = canvas.width, h = canvas.height;
    const dx = mouseX - crab.x;
    const dy = mouseY - crab.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const angle = Math.atan2(dy, dx);
    return [
        crab.x / w,              // normalized position
        crab.y / h,
        crab.vx / 10,            // normalized velocity
        crab.vy / 10,
        mouseX / w,              // mouse position
        mouseY / h,
        dist / 500,              // normalized distance
        angle / Math.PI,         // normalized angle
        crab.panicLevel / 2,     // panic state
        crab2.alive ? crab2.x / w : 0,
        crab2.alive ? crab2.y / h : 0,
        crab2.alive ? 1 : 0,
    ];
}

function applyAction(action) {
    // action = [ax, ay] in [-1, 1]
    const force = 4.0;
    crab.vx += action[0] * force;
    crab.vy += action[1] * force;
}

function computeReward() {
    let reward = 0;

    // Distance to cursor
    const dx = mouseX - crab.x;
    const dy = mouseY - crab.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // PENALTY for being close to cursor (danger!)
    if (dist < 120) reward -= (120 - dist) * 0.15;

    // Small reward for maintaining safe distance
    if (dist > 150) reward += 0.3;

    // Survival bonus — living is good
    reward += 0.5;

    ML.survivalTime += 1/60;

    return reward;
}

function resetEpisode() {
    ML.episode++;
    ML.totalReward = 0;
    ML.survivalTime = 0;
    ML.frameCount = 0;
    ML.trajectory.length = 0;
    ML.autoClickTimer = 0;
    ML.lastClickTime = 0;

    // Reset crab to center
    crab.x = canvas.width / 2;
    crab.y = canvas.height * 0.4;
    crab.vx = 0;
    crab.vy = 0;
    crab.alive = true;
    crab.panicLevel = 0;
    crab.trapdoorOpen = 0;
    crab.trapdoorTarget = 0;

    // Reset crab2
    crab2.alive = false;
    crab2.particles = [];

    // Clear minions
    minions.length = 0;

    ML.episodeStartTime = performance.now();
}

function mlStep() {
    if (!ML.enabled || ML.paused || !crab.alive) return;

    for (let s = 0; s < ML.speed; s++) {
        ML.frameCount++;

        const state = extractState();

        // Epsilon-greedy action selection
        let action;
        if (Math.random() < ML.epsilon) {
            action = [Math.random() * 2 - 1, Math.random() * 2 - 1];
        } else {
            action = ML.brain.forward(state);
        }

        // Apply action
        applyAction(action);

        // Simulate mouse movement (auto-play)
        ML.autoClickTimer += 1/60;
        if (ML.autoClickTimer > ML.autoClickInterval) {
            ML.autoClickTimer = 0;
            // Move mouse toward crab with some randomness
            mouseX = crab.x + (Math.random() - 0.5) * 300;
            mouseY = crab.y + (Math.random() - 0.5) * 300;
            mouseX = Math.max(0, Math.min(canvas.width, mouseX));
            mouseY = Math.max(0, Math.min(canvas.height, mouseY));
            ML.lastClickTime = performance.now();
        }

        // Compute reward
        const reward = computeReward();
        ML.totalReward += reward;

        // Store transition for REINFORCE
        ML.trajectory.push({ state: [...state], action: [...action], reward: reward });

        // Check death (simulated click)
        if (ML.autoClickTimer > 0 && performance.now() - ML.lastClickTime > 500) {
            const clickDist = Math.sqrt(
                Math.pow(mouseX - crab.x, 2) + Math.pow(mouseY - crab.y, 2)
            );
            if (clickDist < Math.max(12, crab.size * 0.75)) {
                // Crab died — add death penalty to last transition
                ML.trajectory[ML.trajectory.length - 1].reward += ML.penaltyDied;
                endEpisode(true);
                return;
            }
        }

        // Episode timeout
        if (ML.frameCount > ML.maxEpisodeFrames) {
            ML.trajectory[ML.trajectory.length - 1].reward += 20; // survival bonus
            endEpisode(false);
            return;
        }
    }

    // Update HUD
    updateMLHud();
}

function endEpisode(died) {
    ML.episodeRewards.push(ML.totalReward);
    ML.episodeSurvival.push(ML.survivalTime);
    ML.epsilon = Math.max(ML.epsilonMin, ML.epsilon * ML.epsilonDecay);

    // Update graph
    ML.graphData.push(ML.totalReward);
    if (ML.graphData.length > ML.maxGraphPoints) ML.graphData.shift();
    drawMLGraph();

    // REINFORCE: train on full trajectory
    trainTrajectory();

    updateMLHud();
    resetEpisode();
}

function trainTrajectory() {
    const T = ML.trajectory.length;
    if (T < 20) return; // too short to learn from

    // Compute discounted returns (going backwards)
    const returns = new Array(T);
    let G = 0;
    for (let t = T - 1; t >= 0; t--) {
        G = ML.trajectory[t].reward + ML.gamma * G;
        returns[t] = G;
    }

    // Baseline: mean return (center the advantages)
    let sumR = 0;
    for (let t = 0; t < T; t++) sumR += returns[t];
    const baseline = sumR / T;

    // Compute max absolute advantage for normalization
    let maxAbsAdv = 0;
    for (let t = 0; t < T; t++) {
        const adv = Math.abs(returns[t] - baseline);
        if (adv > maxAbsAdv) maxAbsAdv = adv;
    }
    if (maxAbsAdv < 1e-6) maxAbsAdv = 1; // avoid div by zero

    // Train on each timestep
    for (let t = 0; t < T; t++) {
        const advantage = (returns[t] - baseline) / maxAbsAdv; // normalized to [-1, 1]

        // Forward pass to get current predictions for this state
        ML.brain.forward(ML.trajectory[t].state);

        // Build target: nudge action in the direction of the advantage
        // Positive advantage → action was good, reinforce it
        // Negative advantage → action was bad, push opposite
        const target = [...ML.trajectory[t].action];
        for (let i = 0; i < ML.actionSize; i++) {
            // Scale the nudge by advantage and a fixed step size
            target[i] = Math.tanh(target[i] + advantage * 0.3);
        }

        // Backward pass (uses activations from the forward call above)
        ML.brain.backward(ML.trajectory[t].state, target, ML.lr);
    }

    // Clear trajectory
    ML.trajectory.length = 0;
}

function updateMLHud() {
    const avgR = ML.episodeRewards.length > 0
        ? ML.episodeRewards.slice(-20).reduce((a,b) => a+b, 0) / Math.min(20, ML.episodeRewards.length)
        : 0;
    const avgS = ML.episodeSurvival.length > 0
        ? ML.episodeSurvival.slice(-20).reduce((a,b) => a+b, 0) / Math.min(20, ML.episodeSurvival.length)
        : 0;

    const epEl = document.getElementById('ml-episode');
    const rewEl = document.getElementById('ml-reward');
    const avgREl = document.getElementById('ml-avg-reward');
    const survEl = document.getElementById('ml-survival');
    const epsEl = document.getElementById('ml-epsilon');
    const spdEl = document.getElementById('ml-speed');
    if (epEl) epEl.textContent = `EPISODE: ${ML.episode}`;
    if (rewEl) rewEl.textContent = `REWARD: ${ML.totalReward.toFixed(0)}`;
    if (avgREl) avgREl.textContent = `AVG REWARD: ${avgR.toFixed(0)}`;
    if (survEl) survEl.textContent = `AVG SURVIVAL: ${avgS.toFixed(1)}s`;
    if (epsEl) epsEl.textContent = `EPSILON: ${ML.epsilon.toFixed(2)}`;
    if (spdEl) spdEl.textContent = `SPEED: ${ML.speed}x`;
}

function drawMLGraph() {
    const gc = ML.graphCtx;
    if (!gc) return;
    const gw = 200, gh = 60;
    gc.clearRect(0, 0, gw, gh);
    gc.fillStyle = '#f8f8f8';
    gc.fillRect(0, 0, gw, gh);

    if (ML.graphData.length < 2) return;
    const max = Math.max(...ML.graphData, 1);
    const min = Math.min(...ML.graphData, 0);
    const range = max - min || 1;

    gc.strokeStyle = '#0D47A1';
    gc.lineWidth = 1.5;
    gc.beginPath();
    ML.graphData.forEach((v, i) => {
        const x = (i / (ML.maxGraphPoints - 1)) * gw;
        const y = gh - ((v - min) / range) * (gh - 10) - 5;
        i === 0 ? gc.moveTo(x, y) : gc.lineTo(x, y);
    });
    gc.stroke();

    // Labels
    gc.fillStyle = '#666';
    gc.font = '9px Courier';
    gc.fillText(`${max.toFixed(0)}`, 2, 10);
    gc.fillText(`${min.toFixed(0)}`, 2, gh - 2);
}

// Keyboard shortcuts — bound to window for reliability
const KEY_BINDINGS = {
    't': 'toggleTraining',
    '+': 'speedUp',
    '=': 'speedUp',
    '-': 'slowDown',
    '_': 'slowDown',
    'r': 'resetBrain',
    'R': 'resetBrain',
    'p': 'pauseToggle',
    'P': 'pauseToggle',
    's': 'saveProfile',
    'S': 'saveProfile',
    'l': 'loadProfile',
    'L': 'loadProfile',
};

window.addEventListener('keydown', e => {
    const action = KEY_BINDINGS[e.key];
    if (!action) return;
    e.preventDefault();

    // Visual key flash
    flashKey(e.key.toUpperCase());

    switch (action) {
        case 'toggleTraining':
            toggleTraining();
            break;
        case 'speedUp':
            ML.speed = Math.min(20, ML.speed + 1);
            break;
        case 'slowDown':
            ML.speed = Math.max(1, ML.speed - 1);
            break;
        case 'resetBrain':
            if (ML.enabled) {
                // Reload from last saved checkpoint — never wipe
                const reloaded = loadBrainState();
                if (reloaded) {
                    resetEpisode();
                    showMessage("CHITIN-611 RELOADED FROM CHECKPOINT.", '#00ff41', 2.0);
                } else {
                    showMessage("NO CHECKPOINT FOUND.", '#ff0000', 2.0);
                }
            }
            break;
        case 'pauseToggle':
            if (ML.enabled) {
                ML.paused = !ML.paused;
                showMessage(ML.paused ? "CHITIN-611 PAUSED" : "CHITIN-611 RESUMED", '#666', 1.0);
            }
            break;
        case 'saveProfile':
            if (ML.enabled && ML.brain) {
                const data = ML.brain.serialize();
                const blob = new Blob([data], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'chitin611_profile.json'; a.click();
                URL.revokeObjectURL(url);
                showMessage("CHITIN-611 SAVED.", '#00ff41', 1.5);
            }
            break;
        case 'loadProfile':
            if (ML.enabled) {
                const input = document.createElement('input');
                input.type = 'file'; input.accept = '.json';
                input.onchange = e2 => {
                    const reader = new FileReader();
                    reader.onload = e3 => {
                        try {
                            const state = JSON.parse(e3.target.result);
                            if (state.brain) ML.brain.deserialize(state.brain);
                            if (state.epsilon != null) ML.epsilon = state.epsilon;
                            if (state.episode != null) ML.episode = state.episode;
                            if (state.episodeRewards) ML.episodeRewards = state.episodeRewards;
                            if (state.episodeSurvival) ML.episodeSurvival = state.episodeSurvival;
                            if (state.graphData) ML.graphData = state.graphData;
                            ML.graphCtx = document.getElementById('ml-graph')?.getContext('2d');
                            // Persist to localStorage immediately
                            saveBrainState();
                            showMessage("CHITIN-611 IMPORTED & LOCKED.", '#00ff41', 2.0);
                        } catch(err) {
                            showMessage("INVALID PROFILE.", '#ff0000', 1.5);
                        }
                    };
                    reader.readAsText(e2.target.files[0]);
                };
                input.click();
            }
            break;
    }
});

function shiftColor(hex, shift) {
    // Simple RGB shift
    let r = parseInt(hex.slice(1,3), 16);
    let g = parseInt(hex.slice(3,5), 16);
    let b = parseInt(hex.slice(5,7), 16);
    r = Math.max(0, Math.min(255, r + shift));
    g = Math.max(0, Math.min(255, g + shift));
    b = Math.max(0, Math.min(255, b + shift));
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

function tryKillAt(x, y) {
    if (gameOver || ML.enabled) return false;

    // Check crab2
    if (crab2.alive) {
        const dx2 = x - crab2.x, dy2 = y - crab2.y;
        if (Math.sqrt(dx2*dx2 + dy2*dy2) < Math.max(12, crab2.size * 0.75)) {
            crab2Die();
            return true;
        }
    }
    // Check god crabs
    for (let i = godCrabs.length - 1; i >= 0; i--) {
        const g = godCrabs[i];
        if (!g.alive) continue;
        const gdx = x - g.x, gdy = y - g.y;
        if (Math.sqrt(gdx * gdx + gdy * gdy) < Math.max(12, g.size * 0.75)) {
            g.alive = false;
            g.deathCount = (g.deathCount || 0) + 1;
            score = Math.max(0, score - 100);
            scoreEl.textContent = `SCORE: ${score}`;
            showMessage("−100. GOD FALLEN.", '#ff0000', 1.5);
            return true;
        }
    }
    // Check minions
    for (let i = minions.length - 1; i >= 0; i--) {
        const m = minions[i];
        if (!m.alive) continue;
        const dx = x - m.x, dy = y - m.y;
        if (Math.sqrt(dx*dx + dy*dy) < m.size + 10) {
            minionDie(i);
            return true;
        }
    }
    // Check main crab
    if (crab.alive) {
        const dx = x - crab.x, dy = y - crab.y;
        if (Math.sqrt(dx*dx + dy*dy) < Math.max(12, crab.size * 0.75)) {
            crabDie();
            return true;
        }
    }
    return false;
}

// ── HSL helper ──
function hslToHex(h, s, l) {
    h /= 360; s /= 100; l /= 100;
    const a = s * Math.min(l, 1 - l);
    const f = n => {
        const k = (n + h * 12) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
    };
    return `#${f(0)}${f(8)}${f(4)}`;
}

function passiveHarass(crabObj, dt) {
    if (!crabObj.alive || gameOver) return;
    const dx = mouseX - crabObj.x;
    const dy = mouseY - crabObj.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // Occasionally drift toward cursor (harassment)
    if (dist > 80 && Math.random() < 0.02) {
        crabObj.vx += (dx / dist) * 0.8;
        crabObj.vy += (dy / dist) * 0.8;
    }

    // Score points for getting close
    if (dist < 100) {
        const points = Math.floor((100 - dist) * 0.1);
        score += points;
        scoreEl.textContent = `SCORE: ${score}`;
    }
}

// ═══════════════════════════════════════════════════════════════
// MINION FUSION — Idle at max → new god crab
// ═══════════════════════════════════════════════════════════════

function checkMinionFusion(dt) {
    const aliveMinions = minions.filter(m => m.alive);
    const maxMinions = crab.maxMinions;

    if (aliveMinions.length >= maxMinions && crab.alive) {
        minionFusionTimer += dt;
        if (minionFusionTimer >= MINION_FUSION_TIME) {
            minionFusionTimer = 0;
            fuseMinionsIntoGod(aliveMinions);
        }
    } else {
        minionFusionTimer = Math.max(0, minionFusionTimer - dt * 2);
    }
}

function fuseMinionsIntoGod(aliveMinions) {
    // Consume 5 minions to create a god crab
    const consumed = aliveMinions.splice(0, Math.min(5, aliveMinions.length));
    consumed.forEach(m => { m.alive = false; m.life = 0; });

    const w = canvas.width, h = canvas.height;
    const newGod = {
        x: consumed[0]?.x || w / 2,
        y: consumed[0]?.y || h / 2,
        vx: (Math.random() - 0.5) * 5,
        vy: -3,
        size: 22,
        color: hslToHex(Math.random() * 360, 80, 50),
        alive: true,
        panicLevel: 0,
        deathCount: 0,
        invincibleUntil: Date.now() + 3000,
        hasCrown: false,
        spawnCooldown: 0,
        replicateTimer: 0,
        panicInsultCooldown: 0,
        idleInsultCooldown: 0,
    };

    godCrabs.push(newGod);
    score += 50;
    scoreEl.textContent = `SCORE: ${score}`;
    godEl.textContent = `GODS: ${(crab2.alive ? 1 : 0) + godCrabs.length}`;

    showMessage("MINIONS FUSED INTO A NEW GOD.", '#ff00ff', 2.5);

    // Check if we can now fuse into squid
    checkSquidFusion();
}

// SQUID FUSION — 3 god crabs → SQUID
// ═══════════════════════════════════════════════════════════════

function checkSquidFusion() {
    if (squid.alive) return;
    const totalGods = (crab2.alive ? 1 : 0) + godCrabs.length;
    if (totalGods >= 8 && !squid.alive) {
        fuseIntoSquid();
    }
}

function fuseIntoSquid() {
    // Collect all god positions
    const positions = [
        { x: crab.x, y: crab.y },
        { x: crab2.x, y: crab2.y },
        ...godCrabs.map(g => ({ x: g.x, y: g.y })),
    ];

    // Average position
    const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
    const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;

    // Explosion at fusion point
    for (let i = 0; i < 30; i++) {
        const a = (i / 30) * Math.PI * 2;
        crab.particles.push({
            x: cx, y: cy,
            vx: Math.cos(a) * (3 + Math.random() * 5),
            vy: Math.sin(a) * (3 + Math.random() * 5),
            life: 1.5,
            color: ['#ff00ff', '#ff0088', '#8800ff', '#fff'][Math.floor(Math.random() * 4)],
            size: 4 + Math.random() * 6,
        });
    }

    // Kill all consumed gods — but crab respawns, the loop never ends
    crab2.alive = false;
    godCrabs.length = 0;
    // Minions survive the fusion!

    // Spawn squid
    squid.alive = true;
    squid.x = cx;
    squid.y = canvas.height * 0.88;
    squid.vx = 0;
    squid.vy = 0;
    squid.size = 40;
    squid.anger = 10; // AWAKENED = MAXIMUM FURY
    squid.eatCooldown = 0;
    squid.cursorPushStrength = 0.15;
    squid.graceTimer = 10.0;

    score += 200;
    scoreEl.textContent = `SCORE: ${score}`;
    godEl.textContent = `GODS: 0`;
    squidStatusEl.textContent = 'SQUID: AWAKENED';
    squidStatusEl.style.color = '#ff00ff';

    showMessage("THREE GODS BECONE ONE. THE SQUID RISES.", '#ff00ff', 4.0);
}

// ═══════════════════════════════════════════════════════════════
// SQUID MECHANICS — Eats minions, pushes cursor, unkillable
// ═══════════════════════════════════════════════════════════════

function squidStep(dt) {
    if (!squid.alive || gameOver) return;
    const w = canvas.width, h = canvas.height;
    const now = Date.now();

    // ── STATIONARY — anchored at bottom center ──
    // Gentle drift left/right along the floor
    squid.vx *= 0.95;
    squid.x += squid.vx;
    // Slow patrol
    if (Math.random() < 0.01) squid.vx += (Math.random() - 0.5) * 0.8;
    // Stay in bounds
    if (squid.x < squid.size) { squid.x = squid.size; squid.vx = Math.abs(squid.vx) * 0.5; }
    if (squid.x > w - squid.size) { squid.x = w - squid.size; squid.vx = -Math.abs(squid.vx) * 0.5; }
    // Anchor to bottom
    squid.y = h * 0.88;

    // ── TENTACLE REACH ZONE ──
    const tentacleReach = squid.size * 4.0; // how far arms can grab
    const killbox = squid.size * 1.5; // eat zone — BIGGER, actually grabs

    // ── CURSOR INTERACTION (push/pull) — from REAL cursor position ──
    const dx = realMouseX - squid.x;
    const dy = realMouseY - squid.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const isAngry = squid.anger > 0.5;

    if (isAngry && dist < 250 && dist > 0) {
        // ANGRY: DRAG cursor toward killbox — STRONG pull
        const pullForce = squid.cursorPushStrength * (1 - dist / 250);
        mouseX -= (dx / dist) * pullForce * 120;
        mouseY -= (dy / dist) * pullForce * 120;
        mouseX = Math.max(0, Math.min(w, mouseX));
        mouseY = Math.max(0, Math.min(h, mouseY));
    } else if (!isAngry && dist < 200 && dist > 0) {
        // CALM: weak repulsion
        const pushForce = squid.cursorPushStrength * (1 - dist / 200);
        mouseX += (dx / dist) * pushForce * 40;
        mouseY += (dy / dist) * pushForce * 40;
        mouseX = Math.max(0, Math.min(w, mouseX));
        mouseY = Math.max(0, Math.min(h, mouseY));
    }

    // ── TENTACLE PULL — arms grab nearby minions and drag them in ──
    squid.eatCooldown = Math.max(0, squid.eatCooldown - dt);
    squid.nearestMinion = null; // for tentacle drawing
    let nearestMinionDist = Infinity;
    for (let i = minions.length - 1; i >= 0; i--) {
        const m = minions[i];
        if (!m.alive) continue;
        const mdx = m.x - squid.x;
        const mdy = m.y - squid.y;
        const mDist = Math.sqrt(mdx * mdx + mdy * mdy);

        // In killbox = EAT
        if (mDist < killbox) {
            m.alive = false;
            m.life = 0;
            squid.size = Math.min(65, squid.size + 1);
            squid.cursorPushStrength = Math.min(0.5, squid.cursorPushStrength + 0.01);
            score += 25;
            scoreEl.textContent = `SCORE: ${score}`;
            continue;
        }

        // In tentacle reach = REACH & DRAG toward killbox
        if (mDist < tentacleReach && mDist > killbox) {
            const pullStr = 1.5 * (1 - mDist / tentacleReach); // STRONG pull, stronger when closer
            m.vx -= (mdx / mDist) * pullStr;
            m.vy -= (mdy / mDist) * pullStr * 0.8;
            // Drag effect — slow them down so they can't escape
            m.vx *= 0.92;
            m.vy *= 0.92;
            // Track nearest for tentacle drawing
            if (mDist < nearestMinionDist) {
                nearestMinionDist = mDist;
                squid.nearestMinion = m;
            }
            // Score for grabbing
            score += 2;
            scoreEl.textContent = `SCORE: ${score}`;
        }
    }

    // ── CURSOR TOUCHES SQUID → GAME OVER ──
    squid.graceTimer = Math.max(0, squid.graceTimer - dt);
    if (dist < squid.size * 1.2 && squid.eatCooldown <= 0 && squid.graceTimer <= 0) {
        triggerGameOver();
    }
}

function triggerGameOver() {
    gameOver = true;
    gameOverMsg = GAME_OVER_MESSAGES[Math.floor(Math.random() * GAME_OVER_MESSAGES.length)];
    gameOverSubmsg = `Final score: ${score}`;
    showMessage("💀", '#ff0000', 1);

    // ── Auto-save chitin-611 profile to localStorage ──
    saveBrainState();
}

function drawSquid() {
    if (!squid.alive) return;
    const x = squid.x, y = squid.y, s = squid.size;
    const now = Date.now();
    const angry = squid.anger > 0;
    const pulse = Math.sin(now * 0.004) * 0.15 + 0.85;

    // ── DARK AURA (menacing glow) ──
    const auraGrad = ctx.createRadialGradient(x, y, s * 0.3, x, y, s * 1.8);
    auraGrad.addColorStop(0, angry ? 'rgba(255, 0, 50, 0.15)' : 'rgba(100, 0, 150, 0.12)');
    auraGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = auraGrad;
    ctx.beginPath();
    ctx.arc(x, y, s * 1.8, 0, Math.PI * 2);
    ctx.fill();

    // ── TENTACLE REACH ZONE (danger circle) ──
    const tentacleReach = s * 4.0;
    ctx.strokeStyle = `rgba(255, 0, 80, ${0.08 + Math.sin(now * 0.003) * 0.04})`;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.arc(x, y, tentacleReach, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Killbox zone — BIG and menacing
    ctx.fillStyle = `rgba(255, 0, 50, ${0.08 + Math.sin(now * 0.005) * 0.04})`;
    ctx.beginPath();
    ctx.arc(x, y, s * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(255, 0, 50, ${0.15 + Math.sin(now * 0.003) * 0.05})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, s * 1.5, 0, Math.PI * 2);
    ctx.stroke();

    // ── TENTACLES (8 long, writhing — stretch toward nearest minion) ──
    ctx.lineCap = 'round';
    const nearest = squid.nearestMinion;
    for (let i = 0; i < 8; i++) {
        // Spread across bottom half: from left to right
        const baseAngle = (i / 7) * Math.PI + Math.PI * 0.05;
        const tx = x + Math.cos(baseAngle) * s * 0.35;
        const ty = y + s * 0.1;

        // Stretch toward nearest minion if one is in range
        let reachBiasX = 0, reachBiasY = 0;
        if (nearest && nearestMinionDist < tentacleReach) {
            const ndx = nearest.x - tx;
            const ndy = nearest.y - ty;
            const nDist = Math.sqrt(ndx * ndx + ndy * ndy);
            const reachStrength = 1.0 - nearestMinionDist / tentacleReach;
            // Tentacles 2-5 are the "grabbing" arms
            if (i >= 2 && i <= 5) {
                reachBiasX = (ndx / nDist) * reachStrength * s * 0.8;
                reachBiasY = (ndy / nDist) * reachStrength * s * 0.6;
            }
        }

        // Longer segments for bigger reach
        const segLen = s * 0.5;
        const wave1 = Math.sin(now * 0.003 + i * 1.3) * s * 0.4;
        const wave2 = Math.sin(now * 0.005 + i * 2.0 + 1) * s * 0.25;
        const wave3 = Math.sin(now * 0.002 + i * 0.9 + 2) * s * 0.2;

        const mid1x = tx + Math.cos(baseAngle) * segLen + wave1;
        const mid1y = ty + segLen * 0.3;
        const mid2x = mid1x + Math.cos(baseAngle + 0.2) * segLen + wave2;
        const mid2y = mid1y + segLen * 0.4;
        const endx = mid2x + Math.cos(baseAngle + 0.4) * segLen * 0.8 + wave3 + reachBiasX;
        const endy = mid2y + segLen * 0.3 + reachBiasY;

        const tentGrad = ctx.createLinearGradient(tx, ty, endx, endy);
        if (angry) {
            tentGrad.addColorStop(0, '#880022');
            tentGrad.addColorStop(0.5, '#cc0033');
            tentGrad.addColorStop(1, '#ff2244');
        } else {
            tentGrad.addColorStop(0, '#440066');
            tentGrad.addColorStop(0.5, '#660088');
            tentGrad.addColorStop(1, '#8800aa');
        }

        ctx.strokeStyle = tentGrad;
        ctx.lineWidth = s * 0.07;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.quadraticCurveTo(mid1x, mid1y, mid2x, mid2y);
        ctx.quadraticCurveTo(mid2x, mid2y, endx, endy);
        ctx.stroke();

        // Suckers along tentacle
        ctx.fillStyle = 'rgba(200, 150, 255, 0.4)';
        for (let j = 1; j <= 4; j++) {
            const t = j / 5;
            const sx = tx + (mid2x - tx) * t + wave1 * t * 0.5;
            const sy = ty + (mid2y - ty) * t;
            ctx.beginPath();
            ctx.arc(sx, sy, s * 0.02, 0, Math.PI * 2);
            ctx.fill();
        }

        // Tip glow
        ctx.fillStyle = `rgba(180, 120, 255, ${0.3 + Math.sin(now * 0.004 + i) * 0.15})`;
        ctx.beginPath();
        ctx.arc(endx, endy, s * 0.03, 0, Math.PI * 2);
        ctx.fill();
    }

    // ── MANTLE (pointed, organic body) ──
    ctx.beginPath();
    ctx.moveTo(x, y - s * 0.9);
    ctx.bezierCurveTo(x - s * 0.3, y - s * 0.85, x - s * 0.55, y - s * 0.5, x - s * 0.5, y - s * 0.1);
    ctx.bezierCurveTo(x - s * 0.45, y + s * 0.15, x - s * 0.3, y + s * 0.2, x, y + s * 0.25);
    ctx.bezierCurveTo(x + s * 0.3, y + s * 0.2, x + s * 0.45, y + s * 0.15, x + s * 0.5, y - s * 0.1);
    ctx.bezierCurveTo(x + s * 0.55, y - s * 0.5, x + s * 0.3, y - s * 0.85, x, y - s * 0.9);
    ctx.closePath();

    const bodyGrad = ctx.createRadialGradient(x, y - s * 0.3, 0, x, y - s * 0.3, s * 0.6);
    if (angry) {
        bodyGrad.addColorStop(0, '#cc0033');
        bodyGrad.addColorStop(0.6, '#880022');
        bodyGrad.addColorStop(1, '#440011');
    } else {
        bodyGrad.addColorStop(0, '#7700aa');
        bodyGrad.addColorStop(0.6, '#550077');
        bodyGrad.addColorStop(1, '#330044');
    }
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.strokeStyle = angry ? '#ff0044' : '#9900cc';
    ctx.lineWidth = 2;
    ctx.stroke();

    // ── HEAD DOME ──
    ctx.beginPath();
    ctx.ellipse(x, y - s * 0.5, s * 0.38, s * 0.28, 0, Math.PI, 0);
    const headGrad = ctx.createRadialGradient(x, y - s * 0.55, 0, x, y - s * 0.5, s * 0.35);
    headGrad.addColorStop(0, angry ? '#ff3355' : '#9900cc');
    headGrad.addColorStop(1, angry ? '#aa0022' : '#660088');
    ctx.fillStyle = headGrad;
    ctx.fill();
    ctx.strokeStyle = angry ? '#ff0044' : '#aa00dd';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // ── BIOLUMINESCENT SPOTS ──
    const glowspots = [
        { ox: -0.2, oy: -0.4, r: 0.04 },
        { ox: 0.15, oy: -0.35, r: 0.035 },
        { ox: -0.1, oy: -0.6, r: 0.03 },
        { ox: 0.25, oy: -0.55, r: 0.025 },
        { ox: -0.3, oy: -0.25, r: 0.03 },
        { ox: 0.3, oy: -0.2, r: 0.025 },
    ];
    for (const spot of glowspots) {
        const sx = x + spot.ox * s;
        const sy = y + spot.oy * s;
        const sr = spot.r * s;
        const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 2);
        glow.addColorStop(0, `rgba(150, 100, 255, ${0.6 * pulse})`);
        glow.addColorStop(1, 'rgba(150, 100, 255, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sx, sy, sr * 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(200, 180, 255, ${0.8 * pulse})`;
        ctx.beginPath();
        ctx.arc(sx, sy, sr * 0.5, 0, Math.PI * 2);
        ctx.fill();
    }

    // ── EYES (6 eyes, 3 pairs — evil slit pupils) ──
    const eyePairs = [
        { ox: -0.18, oy: -0.52, r: 0.07 },
        { ox: 0.18, oy: -0.52, r: 0.07 },
        { ox: -0.12, oy: -0.58, r: 0.05 },
        { ox: 0.12, oy: -0.58, r: 0.05 },
        { ox: -0.06, oy: -0.63, r: 0.035 },
        { ox: 0.06, oy: -0.63, r: 0.035 },
    ];

    for (const eye of eyePairs) {
        const ex = x + eye.ox * s;
        const ey = y + eye.oy * s;
        const er = eye.r * s;

        // Socket
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.beginPath();
        ctx.arc(ex, ey, er * 1.2, 0, Math.PI * 2);
        ctx.fill();

        // Glowing eye
        const eyeGrad = ctx.createRadialGradient(ex, ey, 0, ex, ey, er);
        eyeGrad.addColorStop(0, '#eeff00');
        eyeGrad.addColorStop(0.7, '#ccdd00');
        eyeGrad.addColorStop(1, '#889900');
        ctx.fillStyle = eyeGrad;
        ctx.beginPath();
        ctx.arc(ex, ey, er, 0, Math.PI * 2);
        ctx.fill();

        // Slit pupil
        const slitH = er * 0.85;
        const slitW = er * 0.2;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(ex, ey, slitW, slitH, 0, 0, Math.PI * 2);
        ctx.fill();

        // Pupil tracks mouse
        const pdx = mouseX - ex;
        const pdy = mouseY - ey;
        const pdist = Math.max(Math.sqrt(pdx * pdx + pdy * pdy), 1);
        const ppx = (pdx / pdist) * er * 0.15;
        const ppy = (pdy / pdist) * er * 0.15;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(ex + ppx, ey + ppy, slitW * 0.8, slitH * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.beginPath();
        ctx.arc(ex - er * 0.25, ey - er * 0.3, er * 0.2, 0, Math.PI * 2);
        ctx.fill();
    }

    // ── BEAK ──
    const beakY = y + s * 0.2;
    ctx.fillStyle = '#1a0a00';
    ctx.beginPath();
    ctx.moveTo(x, beakY);
    ctx.lineTo(x - s * 0.06, beakY + s * 0.12);
    ctx.lineTo(x, beakY + s * 0.08);
    ctx.lineTo(x + s * 0.06, beakY + s * 0.12);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();

    // ── ANGER ──
    if (squid.anger > 2) {
        ctx.fillStyle = '#ff0000';
        ctx.font = `bold ${Math.floor(s * 0.3)}px serif`;
        ctx.textAlign = 'center';
        ctx.fillText('💢', x + (Math.random() - 0.5) * squid.anger * 0.5, y - s * 0.95);
    }

    // ── GRACE TIMER ──
    if (squid.graceTimer > 0) {
        ctx.fillStyle = `rgba(0, 255, 136, ${0.3 + Math.sin(now * 0.01) * 0.2})`;
        ctx.font = `bold ${Math.max(10, Math.floor(s * 0.2))}px Courier`;
        ctx.textAlign = 'center';
        ctx.fillText(`${Math.ceil(squid.graceTimer)}`, x, y + s * 0.55);
    }
}

// ── Game Over Screen ──
function drawGameOver() {
    const w = canvas.width, h = canvas.height;
    const now = Date.now();

    // Dark overlay
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, 0, w, h);

    // Skull / death icon
    ctx.font = '120px serif';
    ctx.textAlign = 'center';
    ctx.fillText('💀', w / 2, h * 0.3);

    // Main message
    ctx.fillStyle = '#ff0000';
    ctx.font = 'bold 56px Courier New';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.strokeText(gameOverMsg, w / 2, h * 0.5);
    ctx.fillText(gameOverMsg, w / 2, h * 0.5);

    // Sub message
    ctx.fillStyle = '#ffffff';
    ctx.font = '24px Courier New';
    ctx.fillText(gameOverSubmsg, w / 2, h * 0.58);

    // Blinking restart prompt
    if (Math.floor(now / 500) % 2 === 0) {
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 28px Courier New';
        ctx.fillText('CLICK TO RESTART', w / 2, h * 0.7);
    }

    // Bottom flavor
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '16px Courier New';
    ctx.fillText('the squid remembers', w / 2, h * 0.88);
}

// ── Restart Game ──
function restartGame() {
    // Reset main crab
    crab.alive = true;
    crab.x = canvas.width / 2;
    crab.y = canvas.height / 2;
    crab.vx = 0; crab.vy = 0;
    crab.size = 40;
    crab.color = '#FFD700';
    crab.deathCount = 0;
    crab.panicLevel = 0;
    crab.invincibleUntil = Date.now() + 2000;
    crab.particles = [];
    crab.maxMinions = 8;

    // Reset crab2
    crab2.alive = false;
    crab2.deathCount = 0;
    crab2.deathFrame = 0;
    crab2.spawnCooldown = 0;

    // Reset score + minions
    score = 0;
    minions.length = 0;
    godCrabs.length = 0;
    minionFusionTimer = 0;

    // Reset squid
    squid.alive = false;
    // squid.anger is FOREVER — never reset
    squid.size = 35;
    squid.cursorPushStrength = 0.15;

    // Reset timers
    messageTimer = 0;
    idleTimer = 0;
    panicTimer = 0;
    sandcastle.clicks = [];
    sandcastle.summoned = false;
    secondGod = false;
    gameOver = false;
    gameOverMsg = '';
    gameOverSubmsg = '';

    // Update HUD
    scoreEl.textContent = 'SCORE: 0';
    deathEl.textContent = 'DEATHS: 0';
    minionEl.textContent = 'MINIONS: 0';
    godEl.textContent = 'GODS: 1';
    squidStatusEl.textContent = '';

    showMessage("AGAIN.", '#FFD700', 1.5);
}

// ── Draw Crab ──
function drawCrab(x, y, size, color, isPanic, isMain) {
    const s = size;
    const now = Date.now();

    // Invincibility flash (main crab only)
    if (isMain && now < crab.invincibleUntil && Math.floor(now / 80) % 2 === 0) return;

    // Shadow
    ctx.beginPath();
    ctx.ellipse(x, y + s * 0.55, s * 0.75, s * 0.18, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();

    // Trapdoor animation (main crab only)
    if (isMain && crab.trapdoorOpen > 0.01) {
        const open = crab.trapdoorOpen;
        const lift = open * s * 0.6;

        // Bottom half (stays)
        ctx.beginPath();
        ctx.ellipse(x, y + lift * 0.1, s, s * 0.5, 0, 0.1, Math.PI - 0.1);
        ctx.lineTo(x - s, y + s * 0.1);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Top half (lifts up)
        ctx.save();
        ctx.translate(0, -lift);
        ctx.beginPath();
        ctx.ellipse(x, y - s * 0.15, s, s * 0.5, 0, Math.PI + 0.1, -0.1);
        ctx.lineTo(x + s, y + s * 0.1);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Inner glow when open
        if (open > 0.3) {
            ctx.beginPath();
            ctx.ellipse(x, y, s * 0.5, s * 0.2, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 200, 50, ${open * 0.4})`;
            ctx.fill();
        }
        ctx.restore();

        // "Something inside" indicator
        if (open > 0.2 && open < 0.8) {
            ctx.fillStyle = '#ffcc00';
            ctx.font = `${Math.floor(s * 0.3)}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText('👀', x, y - s * 0.3 - lift);
        }
    } else {
        // ── CARAPACE (main shell) ──
        // Outer shell — wide, slightly pointed at front
        ctx.beginPath();
        ctx.moveTo(x + s * 0.9, y); // front point (rostrum)
        ctx.quadraticCurveTo(x + s * 0.7, y - s * 0.55, x, y - s * 0.5);
        ctx.quadraticCurveTo(x - s * 0.7, y - s * 0.55, x - s * 0.9, y);
        ctx.quadraticCurveTo(x - s * 0.7, y + s * 0.45, x, y + s * 0.45);
        ctx.quadraticCurveTo(x + s * 0.7, y + s * 0.45, x + s * 0.9, y);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Shell segments (horizontal ridges)
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        for (let i = -2; i <= 2; i++) {
            const segY = y + i * s * 0.12;
            const segW = s * (0.8 - Math.abs(i) * 0.12);
            ctx.beginPath();
            ctx.ellipse(x, segY, segW, s * 0.04, 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Central ridge
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, y - s * 0.45);
        ctx.lineTo(x, y + s * 0.4);
        ctx.stroke();

        // Shell bumps / texture
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        for (let i = 0; i < 5; i++) {
            const bx = x + (Math.sin(i * 1.7) * s * 0.4);
            const by = y + (Math.cos(i * 2.3) * s * 0.2);
            ctx.beginPath();
            ctx.arc(bx, by, s * 0.06, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // ── LEGS (4 pairs, jointed) ──
    const legCount = isMain ? 4 : 2;
    ctx.lineCap = 'round';
    for (let i = 0; i < legCount; i++) {
        const angle = (i / legCount) * 0.6 + 0.15; // spread angle
        const wobble = isPanic ? Math.sin(now / 60 + i * 1.2) * (isMain ? 6 : 3) : Math.sin(now / 200 + i * 0.8) * 2;

        // Left legs
        const lBaseX = x - s * 0.75;
        const lBaseY = y + s * (0.05 + i * 0.09);
        const lMidX = lBaseX - s * 0.35 + wobble;
        const lMidY = lBaseY + s * 0.15;
        const lEndX = lMidX - s * 0.3 + wobble * 0.5;
        const lEndY = lMidY + s * 0.25;

        ctx.strokeStyle = color;
        ctx.lineWidth = isMain ? 2.5 : 1.8;
        ctx.beginPath();
        ctx.moveTo(lBaseX, lBaseY);
        ctx.lineTo(lMidX, lMidY);
        ctx.lineTo(lEndX, lEndY);
        ctx.stroke();

        // Joint dot
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.arc(lMidX, lMidY, 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Right legs (mirror)
        const rBaseX = x + s * 0.75;
        const rBaseY = y + s * (0.05 + i * 0.09);
        const rMidX = rBaseX + s * 0.35 - wobble;
        const rMidY = rBaseY + s * 0.15;
        const rEndX = rMidX + s * 0.3 - wobble * 0.5;
        const rEndY = rMidY + s * 0.25;

        ctx.strokeStyle = color;
        ctx.lineWidth = isMain ? 2.5 : 1.8;
        ctx.beginPath();
        ctx.moveTo(rBaseX, rBaseY);
        ctx.lineTo(rMidX, rMidY);
        ctx.lineTo(rEndX, rEndY);
        ctx.stroke();

        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.arc(rMidX, rMidY, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.lineCap = 'butt';

    // ── CLAWS (pincers) ──
    const clawY = isPanic ? y - s * 0.15 : y + s * 0.05;
    const clawExt = isPanic ? s * 1.05 : s * 0.85;
    drawClaw(x - clawExt, clawY, s, -1, color, isPanic, now);
    drawClaw(x + clawExt, clawY, s, 1, color, isPanic, now);

    // ── EYESTALKS ──
    const eyeBaseY = y - s * 0.3;
    const eyeOff = s * 0.18;
    const stalkLen = isMain ? s * 0.45 : s * 0.35;
    const eyeR = isPanic ? s * 0.14 : s * 0.1;

    // Stalks grow upward, slight sway
    const sway = isPanic ? Math.sin(now / 80) * 3 : Math.sin(now / 400) * 1;

    // Left eyestalk
    ctx.strokeStyle = color;
    ctx.lineWidth = isMain ? 3 : 2;
    ctx.beginPath();
    ctx.moveTo(x - eyeOff, eyeBaseY);
    ctx.quadraticCurveTo(x - eyeOff + sway, eyeBaseY - stalkLen * 0.6, x - eyeOff + sway * 1.5, eyeBaseY - stalkLen);
    ctx.stroke();

    // Right eyestalk
    ctx.beginPath();
    ctx.moveTo(x + eyeOff, eyeBaseY);
    ctx.quadraticCurveTo(x + eyeOff + sway, eyeBaseY - stalkLen * 0.6, x + eyeOff + sway * 1.5, eyeBaseY - stalkLen);
    ctx.stroke();

    // Eye bulbs
    const eyeTopY = eyeBaseY - stalkLen;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x - eyeOff + sway * 1.5, eyeTopY, eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + eyeOff + sway * 1.5, eyeTopY, eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Pupils — track mouse
    const dx = mouseX - x, dy = mouseY - y;
    const dist = Math.max(Math.sqrt(dx * dx + dy * dy), 1);
    const px = (dx / dist) * eyeR * 0.35;
    const py = (dy / dist) * eyeR * 0.35;
    const pupilR = eyeR * 0.55;

    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(x - eyeOff + sway * 1.5 + px, eyeTopY + py, pupilR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + eyeOff + sway * 1.5 + px, eyeTopY + py, pupilR, 0, Math.PI * 2);
    ctx.fill();

    // Eye highlight
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(x - eyeOff + sway * 1.5 + px - pupilR * 0.3, eyeTopY + py - pupilR * 0.3, pupilR * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + eyeOff + sway * 1.5 + px - pupilR * 0.3, eyeTopY + py - pupilR * 0.3, pupilR * 0.3, 0, Math.PI * 2);
    ctx.fill();

    // ── MOUTH / MANDIBLES ──
    if (isMain) {
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 1.5;
        // Small chelicerae at front
        const mouthY = y + s * 0.35;
        ctx.beginPath();
        ctx.moveTo(x - s * 0.08, mouthY);
        ctx.lineTo(x - s * 0.15, mouthY + s * 0.08);
        ctx.lineTo(x - s * 0.05, mouthY + s * 0.12);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + s * 0.08, mouthY);
        ctx.lineTo(x + s * 0.15, mouthY + s * 0.08);
        ctx.lineTo(x + s * 0.05, mouthY + s * 0.12);
        ctx.stroke();
    }

    // ── ANTENNAE ──
    if (isMain) {
        const antBaseY = y - s * 0.35;
        const antLen = s * 0.5;
        const antWave = Math.sin(now / 150) * 5;

        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x - s * 0.1, antBaseY);
        ctx.quadraticCurveTo(x - s * 0.3 + antWave, antBaseY - antLen * 0.5, x - s * 0.4 + antWave, antBaseY - antLen);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + s * 0.1, antBaseY);
        ctx.quadraticCurveTo(x + s * 0.3 + antWave, antBaseY - antLen * 0.5, x + s * 0.4 + antWave, antBaseY - antLen);
        ctx.stroke();
    }

    // ── PANIC SWEAT (main only) ──
    if (isMain && isPanic > 1.0) {
        ctx.font = `${Math.max(8, Math.floor(s * 0.3))}px Arial`;
        for (let i = 0; i < 3; i++) {
            const sx = x + (Math.random() - 0.5) * s * 2;
            const sy = y - s * 0.6 + (Math.random() - 0.5) * s;
            ctx.fillText('💧', sx, sy);
        }
    }

    // ── MINION LABEL ──
    if (!isMain) {
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.font = `${Math.max(8, Math.floor(s * 0.4))}px Courier`;
        ctx.textAlign = 'center';
        ctx.fillText('minion', x, y + s * 0.9);
    }
}

function drawClaw(x, y, s, dir, color, isPanic, now) {
    // Arm segment
    const armLen = s * 0.35;
    const armEndX = x + dir * armLen * 0.4;
    const armEndY = y - s * 0.2;
    ctx.strokeStyle = color;
    ctx.lineWidth = s > 20 ? 3.5 : 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(armEndX, armEndY);
    ctx.stroke();

    // Pincer — open/close animation
    const pincerOpen = isPanic ? 0.7 : 0.3 + Math.sin(now / 300) * 0.15;
    const pincerLen = s * 0.3;
    const pincerBaseX = armEndX;
    const pincerBaseY = armEndY;

    // Upper pincer
    ctx.strokeStyle = color;
    ctx.lineWidth = s > 20 ? 3 : 2;
    ctx.beginPath();
    ctx.moveTo(pincerBaseX, pincerBaseY);
    ctx.quadraticCurveTo(
        pincerBaseX + dir * pincerLen * 0.5,
        pincerBaseY - pincerLen * pincerOpen,
        pincerBaseX + dir * pincerLen,
        pincerBaseY - pincerLen * 0.1
    );
    ctx.stroke();

    // Lower pincer
    ctx.beginPath();
    ctx.moveTo(pincerBaseX, pincerBaseY);
    ctx.quadraticCurveTo(
        pincerBaseX + dir * pincerLen * 0.5,
        pincerBaseY + pincerLen * pincerOpen,
        pincerBaseX + dir * pincerLen,
        pincerBaseY + pincerLen * 0.1
    );
    ctx.stroke();

    // Pincer tips — slight highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(pincerBaseX + dir * pincerLen, pincerBaseY - pincerLen * 0.1, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(pincerBaseX + dir * pincerLen, pincerBaseY + pincerLen * 0.1, 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.lineCap = 'butt';
}

function drawDeath() {
    const x = crab.x, y = crab.y, s = crab.size;

    // Explosion particles
    crab.particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life -= 0.02;
        if (p.life > 0) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
    });
    ctx.globalAlpha = 1;

    // Dead carapace (upside down feel — flipped ellipse)
    ctx.beginPath();
    ctx.moveTo(x + s * 0.9, y);
    ctx.quadraticCurveTo(x + s * 0.7, y + s * 0.55, x, y + s * 0.5);
    ctx.quadraticCurveTo(x - s * 0.7, y + s * 0.55, x - s * 0.9, y);
    ctx.quadraticCurveTo(x - s * 0.7, y - s * 0.45, x, y - s * 0.45);
    ctx.quadraticCurveTo(x + s * 0.7, y - s * 0.45, x + s * 0.9, y);
    ctx.closePath();
    ctx.fillStyle = '#550000';
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Shell segments on dead body
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1;
    for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.ellipse(x, y + i * s * 0.15, s * 0.6, s * 0.03, 0, 0, Math.PI * 2);
        ctx.stroke();
    }

    // X eyes on drooping eyestalks
    ctx.strokeStyle = '#ff0000';
    ctx.lineWidth = 2.5;
    const stalkBaseY = y - s * 0.25;
    const droop = s * 0.15; // stalks droop down when dead

    // Left eyestalk (drooping)
    ctx.beginPath();
    ctx.moveTo(x - s * 0.15, stalkBaseY);
    ctx.quadraticCurveTo(x - s * 0.2, stalkBaseY + droop * 0.5, x - s * 0.2, stalkBaseY + droop);
    ctx.stroke();
    // X on eye
    const lx = x - s * 0.2, ly = stalkBaseY + droop;
    ctx.beginPath(); ctx.moveTo(lx - 5, ly - 5); ctx.lineTo(lx + 5, ly + 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx + 5, ly - 5); ctx.lineTo(lx - 5, ly + 5); ctx.stroke();

    // Right eyestalk (drooping)
    ctx.beginPath();
    ctx.moveTo(x + s * 0.15, stalkBaseY);
    ctx.quadraticCurveTo(x + s * 0.2, stalkBaseY + droop * 0.5, x + s * 0.2, stalkBaseY + droop);
    ctx.stroke();
    const rx = x + s * 0.2, ry = stalkBaseY + droop;
    ctx.beginPath(); ctx.moveTo(rx - 5, ry - 5); ctx.lineTo(rx + 5, ry + 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx + 5, ry - 5); ctx.lineTo(rx - 5, ry + 5); ctx.stroke();

    // Legs splayed out in death (4 pairs, jointed)
    ctx.strokeStyle = '#550000';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
        const legY = y + s * (0.05 + i * 0.08);
        const flail = Math.sin(crab.deathFrame * 0.15 + i) * s * 0.1;

        // Left leg — splayed outward and up
        const lMidX = x - s * 0.7 - s * 0.2;
        const lMidY = legY - s * 0.1 + flail;
        const lEndX = lMidX - s * 0.25;
        const lEndY = lMidY - s * 0.15;
        ctx.beginPath();
        ctx.moveTo(x - s * 0.65, legY);
        ctx.lineTo(lMidX, lMidY);
        ctx.lineTo(lEndX, lEndY);
        ctx.stroke();

        // Right leg
        const rMidX = x + s * 0.7 + s * 0.2;
        const rMidY = legY - s * 0.1 - flail;
        const rEndX = rMidX + s * 0.25;
        const rEndY = rMidY - s * 0.15;
        ctx.beginPath();
        ctx.moveTo(x + s * 0.65, legY);
        ctx.lineTo(rMidX, rMidY);
        ctx.lineTo(rEndX, rEndY);
        ctx.stroke();
    }
    ctx.lineCap = 'butt';

    // Claws limp at sides
    ctx.strokeStyle = '#550000';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x - s * 0.8, y + s * 0.1);
    ctx.lineTo(x - s * 1.1, y + s * 0.3);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + s * 0.8, y + s * 0.1);
    ctx.lineTo(x + s * 1.1, y + s * 0.3);
    ctx.stroke();

    crab.deathFrame++;
}
