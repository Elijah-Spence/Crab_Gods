function drawCloud(x, y, size) {
    ctx.beginPath();
    ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
    ctx.arc(x + size * 0.4, y - size * 0.2, size * 0.4, 0, Math.PI * 2);
    ctx.arc(x + size * 0.8, y, size * 0.45, 0, Math.PI * 2);
    ctx.arc(x + size * 0.35, y + size * 0.1, size * 0.35, 0, Math.PI * 2);
    ctx.fill();
}

function drawSandcastle(x, y, scale) {
    const s = scale;
    ctx.fillStyle = '#D4A847';
    ctx.strokeStyle = '#B8942E';
    ctx.lineWidth = 1.5;

    // Main tower
    ctx.fillRect(x - 15 * s, y - 50 * s, 30 * s, 50 * s);
    ctx.strokeRect(x - 15 * s, y - 50 * s, 30 * s, 50 * s);

    // Battlements
    for (let i = 0; i < 3; i++) {
        ctx.fillRect(x - 15 * s + i * 12 * s, y - 60 * s, 8 * s, 10 * s);
    }

    // Side towers
    ctx.fillRect(x - 35 * s, y - 30 * s, 20 * s, 30 * s);
    ctx.strokeRect(x - 35 * s, y - 30 * s, 20 * s, 30 * s);
    ctx.fillRect(x + 15 * s, y - 30 * s, 20 * s, 30 * s);
    ctx.strokeRect(x + 15 * s, y - 30 * s, 20 * s, 30 * s);

    // Door
    ctx.fillStyle = '#8B6914';
    ctx.beginPath();
    ctx.arc(x, y - 5 * s, 7 * s, Math.PI, 0);
    ctx.fillRect(x - 7 * s, y - 5 * s, 14 * s, 10 * s);
    ctx.fill();

    // Flag
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y - 60 * s);
    ctx.lineTo(x, y - 80 * s);
    ctx.stroke();
    ctx.fillStyle = '#FF4444';
    ctx.beginPath();
    ctx.moveTo(x, y - 80 * s);
    ctx.lineTo(x + 12 * s, y - 75 * s);
    ctx.lineTo(x, y - 70 * s);
    ctx.fill();
}

function drawShell(x, y, size, color) {
    ctx.fillStyle = color;
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(x, y, size, size * 0.6, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Spiral lines
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.arc(x, y, size * (0.3 + i * 0.2), 0.5, 2.5);
        ctx.stroke();
    }
}

function drawStarfish(x, y, size, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
        const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const px = x + Math.cos(angle) * size;
        const py = y + Math.sin(angle) * size;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    // Center dot
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.arc(x, y, size * 0.25, 0, Math.PI * 2);
    ctx.fill();
}

function drawSeaweed(x, y) {
    ctx.strokeStyle = '#2E8B57';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    const now = Date.now();
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let i = 0; i < 6; i++) {
        const sx = x + Math.sin(now * 0.002 + i * 0.8) * 8;
        const sy = y - i * 10;
        ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    // Leaves
    ctx.fillStyle = '#3CB371';
    for (let i = 1; i < 5; i += 2) {
        const lx = x + Math.sin(now * 0.002 + i * 0.8) * 8;
        const ly = y - i * 10;
        ctx.beginPath();
        ctx.ellipse(lx + 6, ly, 5, 3, 0.5, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.lineCap = 'butt';
}

let lastTime = performance.now();
let spawnAccum = 0;
const gravity = 0.15;
let secondGod = false;

function gameLoop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    // ML training step — sets actions, auto-moves mouse
    if (ML.enabled && !ML.paused) {
        mlStep();
    }

    // Game Over check
    if (gameOver) {
        drawGameOver();
        requestAnimationFrame(gameLoop);
        return;
    }

    // ── Hold-to-kill ──
    if (mouseDown && !gameOver && !ML.enabled) {
        killCooldown = Math.max(0, killCooldown - dt);
        if (killCooldown <= 0) {
            tryKillAt(mouseX, mouseY);
            killCooldown = KILL_RATE;
        }
    }

    // Passive harassment scoring
    if (!ML.enabled) {
        passiveHarass(crab, dt);
        passiveHarass(crab2, dt);
        godCrabs.forEach(g => passiveHarass(g, dt));
    }

    // Minion fusion check
    checkMinionFusion(dt);

    // ── Squid step ──
    squidStep(dt);

    const w = canvas.width, h = canvas.height;

    // ── God crab physics — full crabgod mechanics ──
    for (const g of godCrabs) {
        if (!g.alive) continue;

        // ── Flee behavior (same as main crab) ──
        const gdx = mouseX - g.x;
        const gdy = mouseY - g.y;
        const gDist = Math.sqrt(gdx * gdx + gdy * gdy);
        const gFleeRadius = 80 + g.deathCount * 5;

        if (gDist < gFleeRadius && gDist > 0) {
            g.panicLevel = Math.min(g.panicLevel + 0.15, 2.0);
            const fleeX = -gdx / gDist;
            const fleeY = -gdy / gDist;
            const speed = (gFleeRadius - gDist) * 1.5 * (1.0 + g.deathCount * 0.1);
            g.vx += fleeX * speed * dt;
            g.vy += fleeY * speed * dt;

            // Panic insult
            g.panicInsultCooldown = Math.max(0, g.panicInsultCooldown - dt);
            if (g.panicInsultCooldown <= 0 && Math.random() < 0.02) {
                showMessage(
                    PANIC_INSULTS[Math.floor(Math.random() * PANIC_INSULTS.length)],
                    '#ff8800', 1.2
                );
                g.panicInsultCooldown = 1.5;
            }
        } else {
            g.panicLevel = Math.max(g.panicLevel - 0.05, 0.0);

            // Idle drift
            if (Math.random() < 0.03) {
                g.vx += (Math.random() - 0.5) * 0.8;
                g.vy += (Math.random() - 0.5) * 0.8;
            }

            // Idle insult
            g.idleInsultCooldown = Math.max(0, g.idleInsultCooldown - dt);
            if (g.panicLevel < 0.1 && g.idleInsultCooldown <= 0 && Math.random() < 0.002) {
                showMessage(
                    IDLE_INSULTS[Math.floor(Math.random() * IDLE_INSULTS.length)],
                    g.color, 2.0
                );
                g.idleInsultCooldown = 3.0;
            }
        }

        // ── Friction ──
        g.vx *= 0.93;
        g.vy *= 0.93;

        // ── Movement (no gravity — floats like main crab) ──
        g.x += g.vx;
        g.y += g.vy;

        // ── Screen wrap (all edges, like main crab) ──
        if (g.x < -g.size) g.x = w + g.size;
        if (g.x > w + g.size) g.x = -g.size;
        if (g.y < -g.size) g.y = h + g.size;
        if (g.y > h + g.size) g.y = -g.size;

        // ── Spawn minions (with trapdoor timing) ──
        if (!g.spawnCooldown) g.spawnCooldown = 0;
        g.spawnCooldown = Math.max(0, g.spawnCooldown - dt);
        if (g.spawnCooldown <= 0 && Math.random() < 0.03) {
            const aliveCount = minions.filter(m => m.alive).length;
            if (aliveCount < 40) {
                const angle = Math.random() * Math.PI * 2;
                const offset = g.size * 0.3;
                const mx = g.x + Math.cos(angle) * offset;
                const my = g.y - g.size * 0.4;
                const minion = createMinion(mx, my, g.color);
                minions.push(minion);
                g.spawnCooldown = 3.0 - g.deathCount * 0.2;

                // Show spawn insult sometimes
                if (Math.random() < 0.15) {
                    showMessage(
                        SPAWN_INSULTS[Math.floor(Math.random() * SPAWN_INSULTS.length)],
                        g.color, 1.5
                    );
                }
            }
        }

        // ── Vibration when panicked ──
        const gvibX = g.panicLevel > 0.5 ? (Math.random() - 0.5) * 6 * g.panicLevel : 0;
        const gvibY = g.panicLevel > 0.5 ? (Math.random() - 0.5) * 6 * g.panicLevel : 0;
        g._renderX = g.x + gvibX;
        g._renderY = g.y + gvibY;
    }

    // ── Beach Background ── Sand on top, Ocean on bottom

    // Sand (top 65%)
    const sandEnd = h * 0.65;
    const sandGrad = ctx.createLinearGradient(0, 0, 0, sandEnd);
    sandGrad.addColorStop(0, '#F5DEB3');
    sandGrad.addColorStop(0.3, '#F4D03F');
    sandGrad.addColorStop(0.6, '#E8C84A');
    sandGrad.addColorStop(1, '#DEB887');
    ctx.fillStyle = sandGrad;
    ctx.fillRect(0, 0, w, sandEnd);

    // Wavy sand ridges
    ctx.fillStyle = 'rgba(210, 170, 90, 0.25)';
    for (let ridge = 0; ridge < 8; ridge++) {
        const ridgeY = ridge * (sandEnd / 8);
        ctx.beginPath();
        for (let x = 0; x <= w; x += 4) {
            const y = ridgeY + Math.sin((x + now * 0.015) * 0.008 + ridge) * 12 + Math.sin(x * 0.02) * 4;
            x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.lineTo(w, ridgeY + 30);
        ctx.lineTo(0, ridgeY + 30);
        ctx.closePath();
        ctx.fill();
    }

    // Sand texture
    ctx.fillStyle = 'rgba(139, 119, 73, 0.12)';
    for (let i = 0; i < 200; i++) {
        const sx = (i * 73 + 17) % w;
        const sy = (i * 47 + 31) % sandEnd;
        ctx.beginPath();
        ctx.arc(sx, sy, 1 + (i % 2), 0, Math.PI * 2);
        ctx.fill();
    }

    // Sun
    const sunX = w * 0.82, sunY = h * 0.1;
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 70);
    sunGrad.addColorStop(0, 'rgba(255, 255, 120, 0.95)');
    sunGrad.addColorStop(0.4, 'rgba(255, 220, 80, 0.4)');
    sunGrad.addColorStop(1, 'rgba(255, 200, 50, 0)');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 70, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFE44D';
    ctx.beginPath();
    ctx.arc(sunX, sunY, 24, 0, Math.PI * 2);
    ctx.fill();

    // Clouds
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    drawCloud(w * 0.15, h * 0.07, 35);
    drawCloud(w * 0.5, h * 0.13, 28);

    // Sandcastle
    drawSandcastle(w * 0.08, sandEnd - 30, 0.6);

    // Sandcastle click counter
    if (!sandcastle.summoned && sandcastle.clicks.length > 0) {
        const now = Date.now();
        sandcastle.clicks = sandcastle.clicks.filter(t => now - t < sandcastle.window);
        if (sandcastle.clicks.length > 0) {
            ctx.fillStyle = '#8B4513';
            ctx.font = 'bold 14px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(`${sandcastle.clicks.length}/${sandcastle.threshold}`, w * 0.08, sandEnd + 20);
            // Glow when close
            if (sandcastle.clicks.length >= 7) {
                ctx.fillStyle = `rgba(255, 100, 0, ${0.3 + Math.sin(now * 0.01) * 0.2})`;
                ctx.beginPath();
                ctx.arc(w * 0.08, sandEnd - 30, 35, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }
    // Always show castle crab count
    if (godCrabs.length > 0 || crab2.alive) {
        ctx.fillStyle = '#FF6600';
        ctx.font = 'bold 12px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(`× ${1 + godCrabs.length}`, w * 0.08, sandEnd + 20);
    }

    // Seashells on sand
    drawShell(w * 0.3, sandEnd - 50, 7, '#FFB6C1');
    drawShell(w * 0.7, sandEnd - 35, 6, '#FFDAB9');
    drawShell(w * 0.9, sandEnd - 55, 5, '#E6E6FA');

    // Starfish
    drawStarfish(w * 0.45, sandEnd - 45, 9, '#FF6347');

    // Footprints in sand
    ctx.fillStyle = 'rgba(139, 119, 73, 0.2)';
    for (let i = 0; i < 4; i++) {
        const fx = w * 0.55 + i * 30;
        const fy = sandEnd - 70 + Math.sin(i * 0.9) * 8;
        ctx.beginPath();
        ctx.ellipse(fx, fy, 4, 7, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(fx + 10, fy + 12, 4, 7, -0.2, 0, Math.PI * 2);
        ctx.fill();
    }

    // ── Ocean (bottom 35%) ──
    const oceanStart = sandEnd;
    const oceanGrad = ctx.createLinearGradient(0, oceanStart, 0, h);
    oceanGrad.addColorStop(0, '#5BA3D9');
    oceanGrad.addColorStop(0.2, '#2E8B57');
    oceanGrad.addColorStop(0.5, '#1E90FF');
    oceanGrad.addColorStop(0.8, '#1565C0');
    oceanGrad.addColorStop(1, '#0D47A1');
    ctx.fillStyle = oceanGrad;
    ctx.fillRect(0, oceanStart, w, h - oceanStart);

    // Animated waves
    for (let wave = 0; wave < 6; wave++) {
        const waveY = oceanStart + 5 + wave * 18;
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.35 - wave * 0.04})`;
        ctx.lineWidth = 2.5 - wave * 0.3;
        ctx.beginPath();
        for (let x = 0; x <= w; x += 3) {
            const y = waveY + Math.sin((x + now * (0.025 + wave * 0.008)) * 0.015) * (8 - wave)
                    + Math.sin((x + now * 0.04) * 0.03) * 3;
            x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    // Foam at shoreline
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    for (let i = 0; i < w; i += 8) {
        const foamY = oceanStart + Math.sin((i + now * 0.03) * 0.02) * 4;
        ctx.beginPath();
        ctx.arc(i, foamY, 3 + Math.sin(i * 0.1) * 2, 0, Math.PI * 2);
        ctx.fill();
    }

    // Seaweed in water
    drawSeaweed(w * 0.2, oceanStart + 30);
    drawSeaweed(w * 0.6, oceanStart + 20);
    drawSeaweed(w * 0.85, oceanStart + 40);

    // ── Main Crab Physics ──
    if (crab.alive) {
        if (!ML.enabled) {
            // Normal flee behavior
            const dx = mouseX - crab.x;
            const dy = mouseY - crab.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const fleeRadius = 80 + crab.deathCount * 5;

            if (dist < fleeRadius && dist > 0) {
                const wasCalm = crab.panicLevel < 0.3;
                crab.panicLevel = Math.min(crab.panicLevel + 0.15, 2.0);
                const fleeX = -dx / dist;
                const fleeY = -dy / dist;
                const speed = (fleeRadius - dist) * 2.0 * (1.0 + crab.deathCount * 0.15);
                crab.vx += fleeX * speed * dt;
                crab.vy += fleeY * speed * dt;

                // Score bump on first panic trigger
                if (wasCalm && crab.panicLevel >= 0.3) {
                    score += 15;
                    scoreEl.textContent = `SCORE: ${score}`;
                }

                statusEl.textContent = 'STATUS: PANIC';
                statusEl.style.color = '#ff0000';

                if (panicTimer <= 0 && Math.random() < 0.03) {
                    showMessage(
                        PANIC_INSULTS[Math.floor(Math.random() * PANIC_INSULTS.length)],
                        '#ff8800', 1.5
                    );
                    panicTimer = 1.5;
                }
            } else {
                crab.panicLevel = Math.max(crab.panicLevel - 0.05, 0.0);
                if (Math.random() < 0.03) {
                    crab.vx += (Math.random() - 0.5) * 0.8;
                    crab.vy += (Math.random() - 0.5) * 0.8;
                }
                statusEl.textContent = 'STATUS: NOMINAL';
                statusEl.style.color = '#00ff41';
            }
        } else {
            // ML mode — brain controls movement, still update panic for visuals
            const dist = Math.sqrt(Math.pow(mouseX - crab.x, 2) + Math.pow(mouseY - crab.y, 2));
            crab.panicLevel = dist < 130 ? Math.min(crab.panicLevel + 0.1, 2.0) : Math.max(crab.panicLevel - 0.05, 0.0);
            statusEl.textContent = `STATUS: CHITIN-611 ACTIVE | EPS: ${ML.epsilon.toFixed(2)}`;
            statusEl.style.color = '#0D47A1';
        }

        crab.vx *= 0.93;
        crab.vy *= 0.93;

        crab.x += crab.vx;
        crab.y += crab.vy;

        // Screen wrap — retreat off one edge, pop out the other
        if (crab.x < -crab.size) crab.x = w + crab.size;
        if (crab.x > w + crab.size) crab.x = -crab.size;
        if (crab.y < -crab.size) crab.y = h + crab.size;
        if (crab.y > h + crab.size) crab.y = -crab.size;

        // ── Spawn Logic ──
        crab.spawnCooldown = Math.max(0, crab.spawnCooldown - dt);
        // Spawn chance increases with death count and panic
        const spawnRate = 0.15 + crab.deathCount * 0.02 + crab.panicLevel * 0.08;
        if (crab.spawnCooldown <= 0) {
            spawnAccum += spawnRate * dt;
            if (spawnAccum >= 1.0) {
                spawnAccum = 0;
                crab.spawnCooldown = 1.5 - crab.deathCount * 0.1; // faster at higher deaths
                spawnMinion();
            }
        }

        // ── Trapdoor Animation ──
        if (crab.trapdoorTimer > 0) {
            crab.trapdoorTimer -= dt;
            if (crab.trapdoorTimer <= 0) {
                spawnMinionActual();
            }
        }
        // Smooth trapdoor open/close
        const trapSpeed = 4.0;
        if (crab.trapdoorOpen < crab.trapdoorTarget) {
            crab.trapdoorOpen = Math.min(crab.trapdoorOpen + trapSpeed * dt, crab.trapdoorTarget);
        } else if (crab.trapdoorOpen > crab.trapdoorTarget) {
            crab.trapdoorOpen = Math.max(crab.trapdoorOpen - trapSpeed * dt, crab.trapdoorTarget);
        }

        // Idle insults
        if (crab.panicLevel < 0.1 && idleTimer <= 0 && Math.random() < 0.003) {
            showMessage(
                IDLE_INSULTS[Math.floor(Math.random() * IDLE_INSULTS.length)],
                '#00ff41', 2.5
            );
            idleTimer = 3.0;
        }

        // Vibration
        const vibX = crab.panicLevel > 0.5 ? (Math.random() - 0.5) * 6 * crab.panicLevel : 0;
        const vibY = crab.panicLevel > 0.5 ? (Math.random() - 0.5) * 6 * crab.panicLevel : 0;

        drawCrab(crab.x + vibX, crab.y + vibY, crab.size, crab.color, crab.panicLevel, true);
    } else {
        drawDeath();
    }

    // ── Crab God 2 Physics ──
    if (crab2.alive) {
        const dx2 = mouseX - crab2.x;
        const dy2 = mouseY - crab2.y;
        const dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
        const fleeR2 = 80;

        if (dist2 < fleeR2 && dist2 > 0) {
            crab2.panicLevel = Math.min(crab2.panicLevel + 0.15, 2.0);
            const fx = -dx2 / dist2, fy = -dy2 / dist2;
            const spd = (fleeR2 - dist2) * 1.8;
            crab2.vx += fx * spd * dt;
            crab2.vy += fy * spd * dt;
        } else {
            crab2.panicLevel = Math.max(crab2.panicLevel - 0.05, 0.0);
            if (Math.random() < 0.03) {
                crab2.vx += (Math.random() - 0.5) * 0.6;
                crab2.vy += (Math.random() - 0.5) * 0.6;
            }
        }

        crab2.vx *= 0.93;
        crab2.vy *= 0.93;
        crab2.x += crab2.vx;
        crab2.y += crab2.vy;

        // Screen wrap
        if (crab2.x < -crab2.size) crab2.x = w + crab2.size;
        if (crab2.x > w + crab2.size) crab2.x = -crab2.size;
        if (crab2.y < -crab2.size) crab2.y = h + crab2.size;
        if (crab2.y > h + crab2.size) crab2.y = -crab2.size;

        const vibX2 = crab2.panicLevel > 0.5 ? (Math.random() - 0.5) * 6 * crab2.panicLevel : 0;
        const vibY2 = crab2.panicLevel > 0.5 ? (Math.random() - 0.5) * 6 * crab2.panicLevel : 0;
        drawCrab(crab2.x + vibX2, crab2.y + vibY2, crab2.size, crab2.color, crab2.panicLevel, true);

        // Crown for sandcastle crab
        if (crab2.hasCrown) {
            const crownX = crab2.x + vibX2;
            const crownY = crab2.y + vibY2 - crab2.size * 0.8;
            const crownW = crab2.size * 0.9;
            const crownH = crab2.size * 0.45;
            const now = Date.now();

            // Crown base
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.moveTo(crownX - crownW, crownY + crownH);
            ctx.lineTo(crownX - crownW, crownY);
            ctx.lineTo(crownX - crownW * 0.5, crownY + crownH * 0.3);
            ctx.lineTo(crownX, crownY - crownH * 0.2);
            ctx.lineTo(crownX + crownW * 0.5, crownY + crownH * 0.3);
            ctx.lineTo(crownX + crownW, crownY);
            ctx.lineTo(crownX + crownW, crownY + crownH);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#B8860B';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Gems
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(crownX, crownY + crownH * 0.4, crownH * 0.12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0066ff';
            ctx.beginPath();
            ctx.arc(crownX - crownW * 0.5, crownY + crownH * 0.5, crownH * 0.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(crownX + crownW * 0.5, crownY + crownH * 0.5, crownH * 0.1, 0, Math.PI * 2);
            ctx.fill();

            // Sparkle
            if (Math.floor(now / 300) % 4 === 0) {
                ctx.fillStyle = '#fff';
                ctx.font = `${Math.floor(crownH * 0.4)}px serif`;
                ctx.textAlign = 'center';
                ctx.fillText('✨', crownX + crownW * 0.3, crownY - crownH * 0.3);
            }
        }
    }

    // ── Crab2 minion spawning ──
    if (crab2.alive) {
        crab2.spawnCooldown = Math.max(0, crab2.spawnCooldown - dt);
        const spawnRate = 0.12 + crab2.deathCount * 0.015;
        if (crab2.spawnCooldown <= 0) {
            crab2.spawnAccum += spawnRate * dt;
            if (crab2.spawnAccum >= 1.0) {
                crab2.spawnAccum = 0;
                crab2.spawnCooldown = 2.0 - crab2.deathCount * 0.15;
                // Spawn minion from crab2
                const angle = Math.random() * Math.PI * 2;
                const offset = crab2.size * 0.3;
                const mx = crab2.x + Math.cos(angle) * offset;
                const my = crab2.y - crab2.size * 0.4 + Math.sin(angle) * offset * 0.3;
                if (minions.filter(m => m.alive).length < crab2.maxMinions) {
                    const minion = createMinion(mx, my, crab2.color);
                    minions.push(minion);
                    minionEl.textContent = `MINIONS: ${minions.filter(m => m.alive).length}`;
                }
            }
        }

        // Castle crab self-replication — spawns more castle crabs!
        if (!crab2.replicateTimer) crab2.replicateTimer = 0;
        crab2.replicateTimer += dt;
        if (crab2.replicateTimer >= 12.0 && godCrabs.length < 20) {
            crab2.replicateTimer = 0;
            // Spawn a new god crab near the castle crab
            const newGod = {
                x: crab2.x + (Math.random() - 0.5) * 100,
                y: crab2.y + (Math.random() - 0.5) * 60,
                vx: (Math.random() - 0.5) * 4,
                vy: -2,
                size: 20 + Math.random() * 8,
                color: hslToHex(Math.random() * 360, 80, 50),
                alive: true,
                panicLevel: 0,
                deathCount: 0,
                invincibleUntil: Date.now() + 3000,
                hasCrown: Math.random() < 0.3,
                spawnCooldown: 0,
                replicateTimer: 0,
                panicInsultCooldown: 0,
                idleInsultCooldown: 0,
            };
            godCrabs.push(newGod);
            score += 10;
            scoreEl.textContent = `SCORE: ${score}`;
            showMessage("THE CASTLE SPREADS.", '#FF6600', 1.5);
        }
    }

    // Crab2 particles
    crab2.particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.life -= 0.015;
        if (p.life > 0) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
    });
    ctx.globalAlpha = 1;
    crab2.particles = crab2.particles.filter(p => p.life > 0);

    // ── Minion Physics ──
    for (let i = minions.length - 1; i >= 0; i--) {
        const m = minions[i];
        if (!m.alive) {
            m.life -= dt * 2;
            m.vy += 0.1; // gravity on dead minions
            m.x += m.vx;
            m.y += m.vy;
            if (m.life <= 0) { minions.splice(i, 1); continue; }
            ctx.globalAlpha = m.life;
            drawCrab(m.x, m.y, m.size * m.life, m.color, false, false);
            ctx.globalAlpha = 1;
            continue;
        }

        m.age += dt;
        m.wobble += dt * 5;

        // Simple flee from cursor
        const mdx = mouseX - m.x;
        const mdy = mouseY - m.y;
        const mDist = Math.sqrt(mdx * mdx + mdy * mdy);
        if (mDist < 80 && mDist > 0) {
            m.vx += (-mdx / mDist) * 1.5 * dt * 60;
            m.vy += (-mdy / mDist) * 1.5 * dt * 60;
        }

        // Random drift
        if (Math.random() < 0.02) {
            m.vx += (Math.random() - 0.5) * 0.5;
            m.vy += (Math.random() - 0.5) * 0.5;
        }

        // Friction
        m.vx *= 0.95;
        m.vy *= 0.95;

        m.x += m.vx;
        m.y += m.vy;

        // Screen wrap
        if (m.x < -m.size) m.x = w + m.size;
        if (m.x > w + m.size) m.x = -m.size;
        if (m.y < -m.size) m.y = h + m.size;
        if (m.y > h + m.size) m.y = -m.size;

        // Fade in
        m.life = Math.min(1.0, m.life + dt * 3);

        ctx.globalAlpha = m.life;
        const mPanic = mDist < 80 ? 1.0 : 0.0;
        drawCrab(m.x, m.y, m.size, m.color, mPanic, false);
        ctx.globalAlpha = 1;
    }

    // ── Particles (main crab) ──
    crab.particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.03;
        p.life -= 0.015;
        if (p.life > 0) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
    });
    ctx.globalAlpha = 1;
    // Clean particles
    crab.particles = crab.particles.filter(p => p.life > 0);

    // ── God Crabs (draw + physics already done above) ──
    for (const g of godCrabs) {
        if (!g.alive) continue;
        const now2 = Date.now();
        const invFlash = g.invincibleUntil > now2 && Math.floor(now2 / 100) % 2;
        // Use vibration coordinates from physics
        const gx = g._renderX !== undefined ? g._renderX : g.x;
        const gy = g._renderY !== undefined ? g._renderY : g.y;
        if (!invFlash) {
            drawCrab(gx, gy, g.size, g.color, g.panicLevel, false);
        }
        // Crown for castle crabs
        if (g.hasCrown && !invFlash) {
            const crownX = gx;
            const crownY = gy - g.size * 0.8;
            const crownW = g.size * 0.9;
            const crownH = g.size * 0.45;

            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.moveTo(crownX - crownW, crownY + crownH);
            ctx.lineTo(crownX - crownW, crownY);
            ctx.lineTo(crownX - crownW * 0.5, crownY + crownH * 0.3);
            ctx.lineTo(crownX, crownY - crownH * 0.2);
            ctx.lineTo(crownX + crownW * 0.5, crownY + crownH * 0.3);
            ctx.lineTo(crownX + crownW, crownY);
            ctx.lineTo(crownX + crownW, crownY + crownH);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#B8860B';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(crownX, crownY + crownH * 0.4, crownH * 0.12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0066ff';
            ctx.beginPath();
            ctx.arc(crownX - crownW * 0.5, crownY + crownH * 0.5, crownH * 0.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(crownX + crownW * 0.5, crownY + crownH * 0.5, crownH * 0.1, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    // Remove dead gods
    for (let i = godCrabs.length - 1; i >= 0; i--) {
        if (!godCrabs[i].alive && godCrabs[i].deathCount > 0) godCrabs.splice(i, 1);
    }
    godEl.textContent = `GODS: ${(crab2.alive ? 1 : 0) + godCrabs.length}`;

    // ── Squid ──
    drawSquid();

    // Timers
    messageTimer = Math.max(0, messageTimer - dt);
    idleTimer = Math.max(0, idleTimer - dt);
    panicTimer = Math.max(0, panicTimer - dt);
    if (messageTimer <= 0) msgEl.classList.remove('visible');

    // Title
    ctx.fillStyle = '#0D47A1';
    ctx.font = 'bold 48px Courier New';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4;
    ctx.strokeText('CRAB GOD', w / 2, 45);
    ctx.shadowColor = '#00000080';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 3;
    ctx.fillText('CRAB GOD', w / 2, 45);
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    // Minion count in HUD
    const aliveMinions = minions.filter(m => m.alive).length;
    minionEl.textContent = `MINIONS: ${aliveMinions}`;

    // ── Custom cursor (drawn at squid-modified mouseX/mouseY) ──
    if (!gameOver) {
        ctx.strokeStyle = mouseDown ? '#ff0000' : 'rgba(0, 240, 255, 0.8)';
        ctx.lineWidth = mouseDown ? 2 : 1.5;
        // Circle
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, mouseDown ? 15 : 10, 0, Math.PI * 2);
        ctx.stroke();
        // Crosshair lines
        const arm = mouseDown ? 20 : 14;
        const gap = mouseDown ? 8 : 5;
        ctx.beginPath();
        ctx.moveTo(mouseX - arm, mouseY); ctx.lineTo(mouseX - gap, mouseY);
        ctx.moveTo(mouseX + gap, mouseY); ctx.lineTo(mouseX + arm, mouseY);
        ctx.moveTo(mouseX, mouseY - arm); ctx.lineTo(mouseX, mouseY - gap);
        ctx.moveTo(mouseX, mouseY + gap); ctx.lineTo(mouseX, mouseY + arm);
        ctx.stroke();
        // Center dot
        ctx.fillStyle = mouseDown ? '#ff0000' : 'rgba(0, 240, 255, 0.6)';
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 2, 0, Math.PI * 2);
        ctx.fill();
    }

    // ── Key flash feedback ──
    if (keyFlashTimer > 0) {
        keyFlashTimer -= dt;
        const alpha = Math.min(1, keyFlashTimer * 2);
        ctx.fillStyle = `rgba(0, 240, 255, ${alpha})`;
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(`[${keyFlashText}]`, mouseX, mouseY - 20);
    }

    requestAnimationFrame(gameLoop);
}

// ── Brain Persistence (localStorage) ──
const BRAIN_STORAGE_KEY = 'chitin611_profile';

function saveBrainState() {
    if (!ML.brain) return;
    try {
        const state = {
            brain: ML.brain.serialize(),
            epsilon: ML.epsilon,
            episode: ML.episode,
            episodeRewards: ML.episodeRewards,
            episodeSurvival: ML.episodeSurvival,
            graphData: ML.graphData,
            score: score,
            deaths: crab.deathCount,
        };
        localStorage.setItem(BRAIN_STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
        console.warn('Failed to save brain state:', e);
    }
}

function loadBrainState() {
    try {
        const raw = localStorage.getItem(BRAIN_STORAGE_KEY);
        if (!raw) return false;
        const state = JSON.parse(raw);
        if (!state.brain) return false;

        ML.brain = new Chitin611(ML.stateSize, ML.hiddenSize, ML.actionSize);
        ML.brain.deserialize(state.brain);
        ML.epsilon = state.epsilon ?? 1.0;
        ML.episode = state.episode ?? 0;
        ML.episodeRewards = state.episodeRewards ?? [];
        ML.episodeSurvival = state.episodeSurvival ?? [];
        ML.graphData = state.graphData ?? [];
        ML.graphCtx = document.getElementById('ml-graph')?.getContext('2d');

        return true;
    } catch (e) {
        console.warn('Failed to load brain state:', e);
        return false;
    }
}

// ── Start ──
const brainLoaded = loadBrainState();
if (brainLoaded) {
    showMessage(`CHITIN-611 RESTORED. EPISODE ${ML.episode}. EPSILON ${ML.epsilon.toFixed(2)}.`, '#0D47A1', 4.0);
} else {
    showMessage("i'm a crab. come at me.", '#00ff41', 3.0);
}
requestAnimationFrame(gameLoop);
</script>
